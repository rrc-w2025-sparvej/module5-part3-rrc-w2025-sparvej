# This workflow checks our YMB project whenever code is pushed to main
# or a pull request targets main. It builds the application images
# and runs the backend tests. If a command fails, the job fails.
# The saved results give Ben Secure a record of the checks performed.

name: YMB CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Run backend tests
        run: docker compose run --rm --no-deps backend python -m pytest tests/ -v

      - name: Clean up
        if: always()
        run: docker compose down